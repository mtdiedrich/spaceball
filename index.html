<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Boarding: Terminal 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
        }
        
        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #scroll-container {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
        
        .step {
            height: 100vh;
            pointer-events: all;
        }
        
        #year-display {
            position: fixed;
            top: 40px;
            right: 40px;
            background: transparent;
            padding: 0;
            font-size: 24px;
            font-weight: normal;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
            z-index: 1000;
            letter-spacing: 2px;
            display: none;
        }
        
        #miles-display {
            position: fixed;
            bottom: 30px;
            left: 30px;
            font-size: 32px;
            font-weight: bold;
            font-family: sans-serif;
            color: #ffffff;
            z-index: 1000;
            display: none;
        }
    </style>
    <link rel="icon" href="icons/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
    <canvas id="map"></canvas>
    
    <div id="scroll-container">
        <div class="step" id="intro-step"></div>
        <div class="step" id="map-step"></div>
        <!-- Will add year steps dynamically -->
    </div>
    
    <div id="year-display">----</div>
    <div id="miles-display"></div>
    
    <script src="src/map.js"></script>
</body>
</html>
